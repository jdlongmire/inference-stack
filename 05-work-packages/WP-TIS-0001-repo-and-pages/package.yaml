id: WP-TIS-0001
title: Stand up The Inference Stack repo and Pages site
status: done
scope: >
  Stand up jdlongmire/inference-stack from longmire-repo-template, migrate the
  AI-Research publication into docs/ under the new brand, define and publish the
  seven-layer framework, and serve the result at inference.thinxai.net.

  NOT in scope: rebuilding or re-posting any existing video; migrating or deleting
  anything in AI-Research or repointing aithinkr.net (it stays live as archive);
  any LinkedIn post; purchasing a new domain.
authority_boundary: >
  Authorized by JD 2026-08-23 ("New repo and GitHub Pages - inference-stack,
  supersedes and subsumes all prior work"): create the repo, scaffold it, migrate
  and rebrand the site content, enable GitHub Pages, and commit and push to main.

  NOT authorized without a fresh explicit go: the inference.thinxai.net DNS record
  (JD's live domain, done); any external post announcing the site; any change to
  AI-Research or aithinkr.net; restating the seven layer names, which
  were supplied by JD 2026-08-23 and are settled.
actions:
  - Create repo from longmire-repo-template (done)
  - Migrate AI-Research docs/ wholesale, rebrand config, includes, palette (done)
  - Install brand assets; derive marks, favicons, OG banner (done)
  - Publish /stack/ with JD's seven layers: Model, Harness, Agent, Context,
    Governance, Orchestration, Product (done)
  - Add /shorts/ index for the video line (done)
  - Rewrite cross-links to the new domain and repo; repoint Giscus (done)
  - Enable GitHub Pages on main /docs with CNAME inference.thinxai.net
  - Add the CNAME DNS record, DNS-only, at Cloudflare (JD or authorized)
  - CI build gate and branch protection: decided against by JD, see notes.md
verification: >
  A machine check, not an assertion: the Pages build reports success; curl of
  https://inference.thinxai.net/ returns 200 with a valid certificate; the site
  search index resolves; no reference to ITIO or AI Operations Center survives
  anywhere in the tree (grep -ri); every internal link resolves.

  Result 2026-08-23, all green: build "built"; https 200 with a valid Let's Encrypt
  cert for inference.thinxai.net, http 301 to https; 47 sitemap URLs fetched, 616
  internal link instances (70 distinct), 0 broken; ITIO grep clean.
disposition: closed
