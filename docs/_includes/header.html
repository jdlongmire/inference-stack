<header class="site-header">
  <div class="container">
    <a href="{{ '/' | relative_url }}" class="site-title">
      <img src="{{ '/assets/brand/mark-square.png' | relative_url }}" alt="" class="site-mark" width="32" height="32">
      <span class="site-title-text">The Inference Stack</span>
    </a>
    <nav class="site-nav">
      <a href="{{ '/stack/' | relative_url }}">The Stack</a>
      <a href="{{ '/articles/' | relative_url }}">Articles</a>
      <a href="{{ '/publications/' | relative_url }}">Publications</a>
      <a href="{{ '/shorts/' | relative_url }}">Shorts</a>
      <a href="https://github.com/jdlongmire/inference-stack" target="_blank" rel="noopener">GitHub</a>
    </nav>
    <div class="search-theme-group">
      <div class="search-wrapper">
        <input type="search" id="site-search" placeholder="Search..." aria-label="Search site">
        <div id="search-results" class="search-results"></div>
      </div>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
        <span id="theme-icon">&#9790;</span>
      </button>
    </div>
  </div>
</header>

<script>
(function() {
  const toggle = document.getElementById('theme-toggle');
  const icon = document.getElementById('theme-icon');
  const root = document.documentElement;

  // head.html already set data-theme before paint. Read it back rather than
  // recomputing, so the two cannot disagree. Dark is the default.
  const theme = root.getAttribute('data-theme') || 'dark';
  icon.textContent = theme === 'dark' ? '☀' : '☾';

  toggle.addEventListener('click', function() {
    const current = root.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    icon.textContent = next === 'dark' ? '☀' : '☾';
  });
})();
</script>
